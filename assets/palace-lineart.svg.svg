<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150">
  <g fill="none" stroke="#8b7355" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground Line -->
    <line x1="10" y1="130" x2="290" y2="130" stroke-width="2"/>
    
    <!-- Main Arch/Entrance -->
    <path d="M 120,130 V 80 A 30,30 0 0 1 180,80 V 130"/>
    <path d="M 130,130 V 90 A 20,20 0 0 1 170,90 V 130"/>
    
    <!-- Central Dome & Spire -->
    <path d="M 110,65 Q 150,20 190,65 Z"/>
    <line x1="150" y1="23" x2="150" y2="8"/>
    <circle cx="150" cy="6" r="2" fill="#8b7355"/>
    
    <!-- Side Towers Left -->
    <rect x="50" y="50" width="40" height="80"/>
    <path d="M 45,50 L 70,25 L 95,50 Z"/>
    <line x1="70" y1="25" x2="70" y2="15"/>
    
    <!-- Side Towers Right -->
    <rect x="210" y="50" width="40" height="80"/>
    <path d="M 205,50 L 230,25 L 255,50 Z"/>
    <line x1="230" y1="25" x2="230" y2="15"/>
    
    <!-- Windows Line Art -->
    <path d="M 65,70 A 5,5 0 0 1 75,70 V 85 H 65 Z"/>
    <path d="M 225,70 A 5,5 0 0 1 235,70 V 85 H 225 Z"/>
  </g>
</svg>
