<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bronzeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8b6e4e"/>
      <stop offset="50%" stop-color="#523b26"/>
      <stop offset="100%" stop-color="#2a1d12"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe89c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <path id="circlePath" d="M 30,100 A 70,70 0 1,1 170,100 A 70,70 0 1,1 30,100"/>
  </defs>
  
  <!-- Shadow & Base -->
  <circle cx="100" cy="104" r="90" fill="rgba(0,0,0,0.25)"/>
  <circle cx="100" cy="100" r="90" fill="url(#bronzeGrad)" stroke="#d4af37" stroke-width="4"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#f3e5ab" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#d4af37" stroke-width="1"/>
  
  <!-- Arabic Text around seal -->
  <text fill="#fce8b3" font-family="'Amiri', serif" font-size="13" font-weight="bold" letter-spacing="2">
    <textPath href="#circlePath" startOffset="50%" text-anchor="middle">MUSTAFA &amp; ESRAA • SPECIAL DAY</textPath>
  </text>
  
  <!-- Center Icon -->
  <text x="100" y="108" fill="#d4af37" font-size="28" text-anchor="middle">💍</text>
</svg>
