<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 120" width="40" height="80">
  <!-- Hanging Chain -->
  <line x1="30" y1="0" x2="30" y2="40" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="2 2"/>
  
  <!-- Lantern Body -->
  <path d="M 15,45 L 30,35 L 45,45 L 40,85 L 30,95 L 20,85 Z" fill="#4a3b2c" stroke="#d4af37" stroke-width="1.5"/>
  
  <!-- Glowing Glass -->
  <polygon points="20,48 30,40 40,48 36,80 30,88 24,80" fill="#ffe082" opacity="0.8"/>
  
  <!-- Bottom Tassel -->
  <line x1="30" y1="95" x2="30" y2="115" stroke="#d4af37" stroke-width="2"/>
  <circle cx="30" cy="116" r="2.5" fill="#d4af37"/>
</svg>
