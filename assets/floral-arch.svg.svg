<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <g fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6">
    <!-- Outer Arch Frame -->
    <path d="M 20,580 V 200 A 180,180 0 0 1 380,200 V 580" stroke-dasharray="6 4"/>
    <path d="M 30,580 V 205 A 170,170 0 0 1 370,205 V 580"/>
    
    <!-- Corner Decorative Flourishes -->
    <path d="M 30,200 C 60,150 100,100 150,80"/>
    <path d="M 370,200 C 340,150 300,100 250,80"/>
  </g>
  
  <!-- Subtle Soft Flowers on top -->
  <g fill="#e8c5c8" opacity="0.7">
    <circle cx="200" cy="25" r="12"/>
    <circle cx="180" cy="30" r="9"/>
    <circle cx="220" cy="30" r="9"/>
    <circle cx="160" cy="40" r="7"/>
    <circle cx="240" cy="40" r="7"/>
  </g>
</svg>
